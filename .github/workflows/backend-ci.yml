name: Backend CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:

jobs:
  validate-version:
    name: Validate Semantic Versioning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate API version
        run: |
          VERSION=$(jq -r '.version' api/package.json)
          echo "API version: $VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid API semver format"
            exit 1
          fi

      - name: Validate MQTT version
        run: |
          VERSION=$(jq -r '.version' mqtt/package.json)
          echo "MQTT version: $VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid MQTT semver format"
            exit 1
          fi

  api-ci:
    name: API - Lint & Test
    runs-on: ubuntu-latest
    needs: validate-version

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: API Lint
        working-directory: api
        run: npm run lint

      - name: API Tests
        working-directory: api
        run: npm test

  mqtt-ci:
    name: MQTT - Lint & Test
    runs-on: ubuntu-latest
    needs: api-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mqtt/package-lock.json

      - name: Install dependencies
        working-directory: mqtt
        run: npm ci

      - name: MQTT Lint
        working-directory: mqtt
        run: npm run lint
