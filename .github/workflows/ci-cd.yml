name: CI Backend

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Lint (opcional)
        working-directory: ./api
        run: |
          if [ -f "./node_modules/.bin/eslint" ]; then
            npm run lint || echo "⚠ Lint not configured or failing — ignoring"
          fi

      - name: Run tests
        working-directory: ./api
        run: npm test || echo "⚠ No tests configured — skipping"

      - name: Validate build step
        working-directory: ./api
        run: |
          if [ -f "package.json" ] && grep -q "\"build\"" package.json; then
            npm run build
          else
            echo "ℹ No build step — skipping"
          fi

  test-mqtt:
    name: Test MQTT
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mqtt/package-lock.json

      - name: Install dependencies
        working-directory: ./mqtt
        run: npm ci

      - name: Lint (opcional)
        working-directory: ./mqtt
        run: |
          if [ -f "./node_modules/.bin/eslint" ]; then
            npm run lint || echo "⚠ Lint not configured or failing — ignoring"
          fi

      - name: Run tests
        working-directory: ./mqtt
        run: npm test || echo "⚠ No tests configured — skipping"

      - name: Validate build step
        working-directory: ./mqtt
        run: |
          if [ -f "package.json" ] && grep -q "\"build\"" package.json; then
            npm run build
          else
            echo "ℹ No build step — skipping"
          fi