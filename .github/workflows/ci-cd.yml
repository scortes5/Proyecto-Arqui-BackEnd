name: CI/CD Backend

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '*.md'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2           
  ECR_REGION: us-east-1           
  IMAGE_TAG: master-${{ github.sha }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Test API
        working-directory: ./api
        run: |
          npm ci
          npm test || echo "⚠️ Tests not configured - skipping"
      
      - name: Test MQTT
        working-directory: ./mqtt
        run: |
          npm ci
          npm test || echo "⚠️ Tests not configured - skipping"

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}    # ✅ us-east-1 para ECR
      
      - name: Login to ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      
      - name: Build and push API image
        working-directory: ./api
        run: |
          echo "Building API image..."
          docker build -t ${{ secrets.ECR_API_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ secrets.ECR_API_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ secrets.ECR_API_REPOSITORY }}:latest
          
          echo "Pushing API image..."
          docker push ${{ secrets.ECR_API_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ECR_API_REPOSITORY }}:latest
          
          echo "✅ API image pushed successfully"
      
      - name: Build and push MQTT image
        working-directory: ./mqtt
        run: |
          echo "Building MQTT image..."
          docker build -t ${{ secrets.ECR_MQTT_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ secrets.ECR_MQTT_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ secrets.ECR_MQTT_REPOSITORY }}:latest
          
          echo "Pushing MQTT image..."
          docker push ${{ secrets.ECR_MQTT_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ECR_MQTT_REPOSITORY }}:latest
          
          echo "✅ MQTT image pushed successfully"

  deploy:
    name: Deploy to EC2 via S3
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials for deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}    # ✅ us-east-2 para S3/CodeDeploy
      
      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          
          mkdir -p deployment-package
          
          cp -r scripts deployment-package/
          cp appspec.yml deployment-package/
          cp docker-compose.prod.yml deployment-package/
          
          cat > deployment-package/.env.images << EOF
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          API_IMAGE=${{ secrets.ECR_API_REPOSITORY }}:${{ env.IMAGE_TAG }}
          MQTT_IMAGE=${{ secrets.ECR_MQTT_REPOSITORY }}:${{ env.IMAGE_TAG }}
          EOF
          
          cd deployment-package
          zip -r ../deployment-${{ github.sha }}.zip .
          cd ..
          
          ls -lh deployment-${{ github.sha }}.zip
          
          echo "✅ Deployment package created"
      
      - name: Upload to S3
        run: |
          echo "Uploading to S3..."
          echo "S3 bucket secret (raw):"
          printf '%q\n' "${{ secrets.S3_DEPLOYMENT_BUCKET }}"
          echo ""
          echo "Length of secret:"
          echo -n "${{ secrets.S3_DEPLOYMENT_BUCKET }}" | wc -c
          aws s3 cp deployment-${{ github.sha }}.zip s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/grupo-04-backend/deployment-${{ github.sha }}.zip --region ${{ env.AWS_REGION }}
          echo "✅ Package uploaded to S3"
      
      - name: Create CodeDeploy deployment
        id: deploy
        run: |
          echo "Creating CodeDeploy deployment..."
          
          # Crear deployment y capturar todo el output
          deployment_output=$(aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APPLICATION_NAME }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --s3-location bucket=${{ secrets.S3_DEPLOYMENT_BUCKET }},key=grupo-04-backend/deployment-${{ github.sha }}.zip,bundleType=zip \
            --description "Deployment of commit ${{ github.sha }}" \
            --region ${{ env.AWS_REGION }} 2>&1)
          
          echo "AWS Response: $deployment_output"
          
          # Extraer el deployment ID del output JSON
          deployment_id=$(echo "$deployment_output" | grep -o '"deploymentId": "[^"]*"' | cut -d'"' -f4)
          
          if [ -z "$deployment_id" ]; then
            echo "❌ Failed to extract deployment ID"
            echo "Full output: $deployment_output"
            exit 1
          fi
          
          echo "deployment_id=$deployment_id" >> $GITHUB_OUTPUT
          echo "✅ Deployment created: $deployment_id"
          echo "🔗 Console: https://console.aws.amazon.com/codesuite/codedeploy/deployments/$deployment_id?region=${{ env.AWS_REGION }}"
      
      - name: Wait for deployment
        run: |
          DEPLOYMENT_ID="${{ steps.deploy.outputs.deployment_id }}"
          
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ Deployment ID is empty"
            exit 1
          fi
          
          echo "Waiting for deployment $DEPLOYMENT_ID to complete..."
          echo "This may take several minutes..."
          
          # Loop manual en lugar de aws deploy wait
          MAX_ATTEMPTS=80  # 80 * 15s = 20 minutos
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            
            # Obtener el estado actual
            STATUS=$(aws deploy get-deployment \
              --deployment-id "$DEPLOYMENT_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'deploymentInfo.status' \
              --output text 2>&1)
            
            echo "[$ATTEMPT/$MAX_ATTEMPTS] Status: $STATUS"
            
            case "$STATUS" in
              "Succeeded")
                echo "✅ Deployment succeeded!"
                exit 0
                ;;
              "Failed")
                echo "❌ Deployment failed"
                aws deploy get-deployment \
                  --deployment-id "$DEPLOYMENT_ID" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'deploymentInfo.errorInformation'
                exit 1
                ;;
              "Stopped")
                echo "⏹️ Deployment was stopped"
                exit 1
                ;;
              "Created"|"Queued"|"InProgress")
                # Todavía en progreso
                sleep 15
                ;;
              *)
                echo "⚠️ Unknown status: $STATUS"
                sleep 15
                ;;
            esac
          done
          
          echo "⏱️ Deployment timeout after 20 minutes"
          exit 1
      
      - name: Get deployment status
        if: always()
        run: |
          DEPLOYMENT_ID="${{ steps.deploy.outputs.deployment_id }}"
          
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "⚠️ No deployment ID available"
            exit 0
          fi
          
          echo "📊 Final Deployment Status:"
          echo "=========================="
          
          STATUS=$(aws deploy get-deployment \
            --deployment-id "$DEPLOYMENT_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'deploymentInfo.status' \
            --output text)
          
          echo "Status: $STATUS"
          echo "Deployment ID: $DEPLOYMENT_ID"
          echo ""
          echo "🔗 View details:"
          echo "https://console.aws.amazon.com/codesuite/codedeploy/deployments/$DEPLOYMENT_ID?region=${{ env.AWS_REGION }}"
          
          if [ "$STATUS" != "Succeeded" ]; then
            echo ""
            echo "❌ Deployment did not succeed"
            echo "Check the AWS Console for detailed logs"
            
            # Mostrar error si existe
            aws deploy get-deployment \
              --deployment-id "$DEPLOYMENT_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'deploymentInfo.errorInformation' \
              --output json 2>/dev/null || true
            
            exit 1
          fi
          
          echo "✅ Deployment completed successfully!"