name: CI/CD Backend

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  IMAGE_TAG: master-${{ github.sha }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Test API
        working-directory: ./api
        run: |
          npm ci
          npm test || echo "⚠️ Tests not configured - skipping"
      
      - name: Test MQTT
        working-directory: ./mqtt
        run: |
          npm ci
          npm test || echo "⚠️ Tests not configured - skipping"

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      
      - name: Build and push API image
        working-directory: ./api
        run: |
          echo "Building API image..."
          docker build -t ${{ secrets.ECR_API_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ secrets.ECR_API_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ secrets.ECR_API_REPOSITORY }}:latest
          
          echo "Pushing API image..."
          docker push ${{ secrets.ECR_API_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ECR_API_REPOSITORY }}:latest
          
          echo "✅ API image pushed successfully"
      
      - name: Build and push MQTT image
        working-directory: ./mqtt
        run: |
          echo "Building MQTT image..."
          docker build -t ${{ secrets.ECR_MQTT_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ secrets.ECR_MQTT_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ secrets.ECR_MQTT_REPOSITORY }}:latest
          
          echo "Pushing MQTT image..."
          docker push ${{ secrets.ECR_MQTT_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ECR_MQTT_REPOSITORY }}:latest
          
          echo "✅ MQTT image pushed successfully"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create CodeDeploy deployment
        id: deploy
        run: |
          echo "Creating deployment..."
          
          deployment_id=$(aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APPLICATION_NAME }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --github-location repository=${{ github.repository }},commitId=${{ github.sha }} \
            --ignore-application-stop-failures \
            --description "Deployment of commit ${{ github.sha }}" \
            --query 'deploymentId' \
            --output text)
          
          echo "deployment_id=$deployment_id" >> $GITHUB_OUTPUT
          echo "✅ Deployment created: $deployment_id"
      
      - name: Monitor deployment
        run: |
          echo "Monitoring deployment: ${{ steps.deploy.outputs.deployment_id }}"
          echo "Check status at: https://console.aws.amazon.com/codesuite/codedeploy/deployments/${{ steps.deploy.outputs.deployment_id }}"